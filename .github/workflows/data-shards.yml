name: Data shard verification
on:
  push:
  pull_request:
jobs:
  image-classification-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-data.txt scikit-learn==1.8.0 gdown==6.2.0 pytest "matplotlib>=3.9,<4"
      - name: Verify original-image labels, cache commits, grouped training and runtime package
        run: python -m pytest tests/test_image_classification.py tests/test_image_classification_runtime_builder.py tests/test_image_study_report.py tests/test_image_classification_studies.py tests/test_image_classification_improvement.py tests/test_image_classification_audit.py tests/test_image_classification_execution.py tests/test_retccl_public_download.py tests/test_pathology_encoder.py
  mil-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-pretrain.txt pytest
      - name: Verify MIL, epoch transactions, replay and nested study
        run: python -m pytest tests/test_mil_*.py tests/test_pathology_encoder.py tests/test_image_finetune.py tests/test_image_classification_execution.py
  pretrain-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pretrain.txt pytest
      - name: Verify governed bundles and unattended CPU orchestration
        run: python -m pytest tests/test_pretrain.py tests/test_pretrain_runner.py tests/test_pretrain_notebook.py
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-data.txt pytest ruff
      - run: ruff check .
      - run: python -m compileall -q histology_data scripts tests
      - run: python -m pytest tests/test_data_catalog.py tests/test_data_shards_storage.py tests/test_data_shards_processing.py tests/test_data_shards_cli.py tests/test_data_shards_notebook.py tests/test_precut.py tests/test_medical_guardrails.py
      - run: python -m pytest tests/test_colab_manager.py
      - run: python -m pytest tests/test_feature_sources.py tests/test_features.py tests/test_feature_notebook.py tests/test_feature_encoder.py
  features-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-data.txt pytest
      - name: Prepare six synthetic patches for genuine encoder E2E
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy
          root = Path('/tmp/feature-fixture')
          root.mkdir()
          runpy.run_path('tests/test_features.py')['fixture'](root, parts=1)
          PY
      - name: Check official frozen encoder, verified publication and resume
        run: |
          python -m scripts.smoke_features --metadata /tmp/feature-fixture/metadata.csv \
            --source-root /tmp/feature-fixture/inputs --source-kind zip \
            --output /tmp/feature-fixture/out --work-root /tmp/feature-fixture/scratch \
            --weights-dir /tmp/histology-feature-weights
      - run: python -m pytest tests/test_feature_sources.py tests/test_features.py tests/test_feature_notebook.py tests/test_feature_encoder.py
  dual-track-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-pretrain.txt pytest
      - run: python -m pip install 'matplotlib>=3.9,<4'
      - name: Verify scopes, photo lineage, clustering, novelty, nested studies and resume
        run: python -m pytest tests/test_dual_*.py

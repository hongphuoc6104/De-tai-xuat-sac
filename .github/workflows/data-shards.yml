name: Data shard verification
on:
  push:
  pull_request:
jobs:
  pretrain-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pretrain.txt pytest
      - name: Verify governed bundles and unattended CPU orchestration
        run: python -m pytest tests/test_pretrain.py tests/test_pretrain_runner.py tests/test_pretrain_notebook.py
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-data.txt pytest ruff
      - run: ruff check .
      - run: python -m compileall -q histology_data scripts tests
      - run: python -m pytest tests/test_data_catalog.py tests/test_data_shards_storage.py tests/test_data_shards_processing.py tests/test_data_shards_cli.py tests/test_data_shards_notebook.py tests/test_precut.py tests/test_medical_guardrails.py
      - run: python -m pytest tests/test_feature_sources.py tests/test_features.py tests/test_feature_notebook.py tests/test_feature_encoder.py
  features-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-data.txt pytest
      - name: Prepare six synthetic patches for genuine encoder E2E
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy
          root = Path('/tmp/feature-fixture')
          root.mkdir()
          runpy.run_path('tests/test_features.py')['fixture'](root, parts=1)
          PY
      - name: Check official frozen encoder, verified publication and resume
        run: |
          python -m scripts.smoke_features --metadata /tmp/feature-fixture/metadata.csv \
            --source-root /tmp/feature-fixture/inputs --source-kind zip \
            --output /tmp/feature-fixture/out --work-root /tmp/feature-fixture/scratch \
            --weights-dir /tmp/histology-feature-weights
      - run: python -m pytest tests/test_feature_sources.py tests/test_features.py tests/test_feature_notebook.py tests/test_feature_encoder.py

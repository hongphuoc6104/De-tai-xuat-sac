name: Data shard verification
on:
  push:
  pull_request:
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-data.txt pytest ruff
      - run: ruff check .
      - run: python -m compileall -q histology_data scripts tests
      - run: python -m pytest tests/test_data_catalog.py tests/test_data_shards_storage.py tests/test_data_shards_processing.py tests/test_data_shards_cli.py tests/test_data_shards_notebook.py tests/test_medical_guardrails.py
      - run: python -m pytest tests/test_colab_manager.py
